# Serverless jobs — this workspace allows serverless compute only, so there
# are no job_clusters. On serverless, wheels are installed per-task via an
# environment spec (the classic `libraries` block isn't supported).
resources:
  jobs:
    # Weekly batch spine: GTFS static download -> Bronze -> Silver SCD2
    gtfs_static_weekly:
      name: "[${bundle.target}] marta-pulse GTFS static weekly"
      schedule:
        quartz_cron_expression: "0 0 7 ? * MON"   # Mondays 07:00 UTC
        timezone_id: UTC
      environments:
        - environment_key: default
          spec: &env_spec
            client: "3"
            dependencies:
              - ../../dist/marta_pulse-0.3.0-py3-none-any.whl
      tasks:
        - task_key: bronze_gtfs_ingest
          environment_key: default
          notebook_task:
            notebook_path: ../src/bronze_gtfs_ingest.py
            base_parameters: &params
              catalog: ${var.catalog}
        - task_key: silver_schedule_conform
          depends_on: [{ task_key: bronze_gtfs_ingest }]
          environment_key: default
          notebook_task:
            notebook_path: ../src/silver_schedule_conform.py
            base_parameters: *params

    # Fast loop: Event Hub -> Bronze -> Silver -> Gold, every 15 minutes
    telemetry_refresh:
      name: "[${bundle.target}] marta-pulse telemetry refresh"
      schedule:
        quartz_cron_expression: "0 0/15 * * * ?"
        timezone_id: UTC
      environments:
        - environment_key: default
          spec: *env_spec
      tasks:
        - task_key: bronze_telemetry_stream
          environment_key: default
          notebook_task:
            notebook_path: ../src/bronze_telemetry_stream.py
            base_parameters:
              catalog: ${var.catalog}
              eventhub_namespace: ${var.eventhub_namespace}
              eventhub_name: ${var.eventhub_name}
              secret_scope: ${var.secret_scope}
        - task_key: silver_telemetry_conform
          depends_on: [{ task_key: bronze_telemetry_stream }]
          environment_key: default
          notebook_task:
            notebook_path: ../src/silver_telemetry_conform.py
            base_parameters: *params
        - task_key: gold_deviation
          depends_on: [{ task_key: silver_telemetry_conform }]
          environment_key: default
          notebook_task:
            notebook_path: ../src/gold_deviation.py
            base_parameters: *params
        # Serialized after gold_deviation on purpose: both MERGE into
        # fact_schedule_deviation, and concurrent writers to one Delta table
        # race on both the ALTER and the commit.
        - task_key: gold_rail_deviation
          depends_on: [{ task_key: gold_deviation }]
          environment_key: default
          notebook_task:
            notebook_path: ../src/gold_rail_deviation.py
            base_parameters: *params
        - task_key: gold_headway_bunching
          depends_on:
            - { task_key: gold_deviation }
            - { task_key: gold_rail_deviation }
          environment_key: default
          notebook_task:
            notebook_path: ../src/gold_headway_bunching.py
            base_parameters: *params
